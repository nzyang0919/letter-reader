<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>一封信</title>
  <script data-goatcounter="https://ynzzz.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #f7f4ef;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }
    body {
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .counter {
      text-align: center;
      padding: 16px 0 8px;
      font-size: 14px;
      color: #888;
    }
    .sentence {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 28px 24px;
      font-size: 22px;
      line-height: 1.75;
      text-align: left;
      word-break: break-word;
    }
    .nav {
      display: flex;
      gap: 12px;
      padding: 12px 16px 20px;
    }
    button {
      flex: 1;
      height: 52px;
      border: 1px solid #d8d2c8;
      border-radius: 10px;
      background: #fff;
      font-size: 17px;
      color: #222;
    }
    button:disabled {
      color: #bbb;
      background: #eee;
    }
    button:active:not(:disabled) {
      background: #ece8e1;
    }
  </style>
</head>
<body>
  <div class="counter" id="counter"></div>
  <div class="sentence" id="sentence"></div>
  <div class="nav">
    <button id="prev" type="button">上一句</button>
    <button id="next" type="button">下一句</button>
  </div>
  <script>
    const sentences = [
      "知道你不喜欢一下看到一大段文字，所以我把拆成一句句跟你讲，我厉害吧。",
      "也许你还没准备好怎么跟我说话，但我从上个月到现在根本不能放平心态。",
      "每天睡觉起床前都要思考什么时候能跟你说话，纠结得让我点开微信又关掉。",
      "为什么纠结，因为工作的这段时间让我越来越迷茫。",
      "这份工作目前让我偏离预期，觉得它现在没让我学到什么有用的东西。",
      "我真的很害怕，害怕自己1-2年后还是这个样子，被关在这里出不去，这种不确定性让我不知道该怎么跟你提。",
      "我知道一直以来都是因为异地的问题让你犹豫，我很理解，所以这几周我也很迷茫焦虑不知所措。",
      "我甚至不知道我自己什么时候回去，就像这样的工作内容持续半年我就想回去了，又或是干了1-2年我觉得自己具备了离开的条件，我就会去找下一家。",
      "这种短期的不确定性对你喜欢的人来说很不公平。",
      "说完不确定的，现在说确定的。",
      "未来我一定会回去，我一定会很想我爸我妈我姐我弟弟哈哈，当然也很想你。",
      "同时我不会用七八年无聊的生活和毫无成长的工作去换一个境外永久的身份。",
      "也许只有在未来真的拥有了一个非常难得的机会我才会继续留在这里呆上几年。",
      "如果到时候代价是要分开，我一定会想尽一切办法不和喜欢的人分开，即使要放弃这个机会。",
      "为什么现在做不到这一点，我觉得还是因为有点年龄焦虑哈哈，我得趁着自己没有那么那么那么那么喜欢你之前再尝试努力一下。",
      "虽然我现在还没达到你所认为的多么坚定的喜欢一个人，不能毅然决然的选择为了一个人回去。",
      "但如果1年多2年后我发现自己还是忘不掉，那我一定不会再续签了。",
      "糟糕的是可能又要让人等一年多才行，对不起。",
      "说这些也不是让你立刻做出什么决定，只是想跟你坦诚地讲一下，我想把决定权交给你。",
      "是成为像十年前朋友一样，还是像四年前的朋友一样。",
      "你做什么决定现阶段我也都接受。",
      "出于私心当然希望你还是舍不得我的哈哈。",
      "等你想好了，再告诉我，等你。"
    ];
  const sentences = [
    // 这里保留你原来的 23 句话，不要改
  ];

  let i = 0;
  const el = document.getElementById("sentence");
  const counter = document.getElementById("counter");
  const prev = document.getElementById("prev");
  const next = document.getElementById("next");

  function trackProgress() {
    if (!window.goatcounter || !window.goatcounter.count) return;

    window.goatcounter.count({
      path: "sentence-" + (i + 1),
      title: "阅读进度 " + (i + 1) + " / " + sentences.length,
      event: true
    });

    if (
      i === sentences.length - 1 &&
      !sessionStorage.getItem("letterCompleted")
    ) {
      window.goatcounter.count({
        path: "completed",
        title: "完成阅读",
        event: true
      });

      sessionStorage.setItem("letterCompleted", "1");
    }
  }

  function render(track = false) {
    el.textContent = sentences[i];
    counter.textContent = (i + 1) + " / " + sentences.length;
    prev.disabled = i === 0;
    next.disabled = i === sentences.length - 1;

    if (track) {
      trackProgress();
    }
  }

  prev.addEventListener("click", () => {
    if (i > 0) {
      i--;
      render(true);
    }
  });

  next.addEventListener("click", () => {
    if (i < sentences.length - 1) {
      i++;
      render(true);
    }
  });

  let startY = 0;

  document.addEventListener(
    "touchstart",
    (e) => {
      startY = e.changedTouches[0].clientY;
    },
    { passive: true }
  );

  document.addEventListener(
    "touchend",
    (e) => {
      const dy = e.changedTouches[0].clientY - startY;

      if (Math.abs(dy) < 40) return;

      if (dy < 0 && i < sentences.length - 1) i++;
      if (dy > 0 && i > 0) i--;

      render(true);
    },
    { passive: true }
  );

  render();
  </script>
</body>
</html>
